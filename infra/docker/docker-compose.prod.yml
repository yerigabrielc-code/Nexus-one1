# Stack de producción completo. Levantar: docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - pg:/var/lib/postgresql/data
      - ./init-app-role.sql:/docker-entrypoint-initdb.d/10-init-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus_owner} -d ${POSTGRES_DB:-nexus}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nexus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?required}
    ports:
      - "15672:15672"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_started }
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL}
      DATABASE_RELAY_URL: ${DATABASE_RELAY_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: ${RABBITMQ_URL}
      WEB_ORIGIN: ${WEB_ORIGIN}
      SEED_ON_START: ${SEED_ON_START:-false}
      API_PORT: "3001"
    ports:
      - "3001:3001"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pg:
